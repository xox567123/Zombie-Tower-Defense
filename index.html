<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Defense Evolution Cost Updater</title>
  <style>
    * {
      box-sizing: border-box;
    }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #102027;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  width: min(600px, 92vw);
  padding: 28px;
  background: #263238;
  border: 3px solid white;
  border-radius: 16px;
  box-shadow: 0 8px 24px #0008;
  text-align: center;
}

h1 {
  margin-top: 0;
  color: #ffca28;
}

label {
  display: inline-flex;
  padding: 12px 18px;
  background: #7e57c2;
  border-radius: 10px;
  box-shadow: 0 4px 0 #4527a0;
  cursor: pointer;
  font-weight: bold;
}

input {
  display: none;
}

#status {
  margin-top: 20px;
  padding: 12px;
  background: #37474f;
  border-radius: 10px;
  line-height: 1.5;
}

.success {
  color: #76ff03;
}

.error {
  color: #ff8a80;
}

  </style>
</head>
<body>
  <main>
    <h1>Zombie Defense File Updater</h1>
    <p>Select your original Zombie Defense HTML file.</p>
    <p>The complete updated file will download automatically with every evolution costing $1,000.</p>
<label>
  Select Original HTML
  <input id="fileInput" type="file" accept=".html,text/html">
</label>

<div id="status">Waiting for your original game file.</div>

  </main>
  <script>
    "use strict";

    const fileInput = document.getElementById("fileInput");
    const status = document.getElementById("status");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        let html = String(reader.result);
        let changes = 0;

        const saveKeyCode =
          'const SAVE_KEY="zombieDefenseV5BossInvasionExpanded";';

        const saveKeyReplacement =
          'const SAVE_KEY="zombieDefenseV5BossInvasionExpanded"; const EVOLUTION_COST=1000;';

        if (!html.includes("const EVOLUTION_COST=1000;")) {
          if (!html.includes(saveKeyCode)) {
            showError("Could not find the SAVE_KEY section in this file.");
            return;
          }

          html = html.replace(saveKeyCode, saveKeyReplacement);
          changes++;
        }

        const oldEvolutionButton =
          '<button class="purple" data-evolution="${index}"> Evolve into ${evolution.name} </button>';

        const newEvolutionButton =
          '<button class="purple" data-evolution="${index}" ${money<EVOLUTION_COST?"disabled":""}> Evolve into ${evolution.name} — $${EVOLUTION_COST} </button>';

        if (html.includes(oldEvolutionButton)) {
          html = html.replace(oldEvolutionButton, newEvolutionButton);
          changes++;
        } else if (!html.includes('money<EVOLUTION_COST?"disabled":""')) {
          showError("Could not find the evolution button code.");
          return;
        }

        const oldEvolutionStart =
          'function evolveTower(tower,index){ if(tower.evolution||totalUpgradeCount(tower)<5)return; const evolution=(evolutions[tower.type]||[])[index]; if(!evolution)return; tower.evolution=evolution;';

        const newEvolutionStart =
          'function evolveTower(tower,index){ if(tower.evolution||totalUpgradeCount(tower)<5||money<EVOLUTION_COST)return; const evolution=(evolutions[tower.type]||[])[index]; if(!evolution)return; money-=EVOLUTION_COST; tower.spent+=EVOLUTION_COST; tower.evolution=evolution;';

        if (html.includes(oldEvolutionStart)) {
          html = html.replace(oldEvolutionStart, newEvolutionStart);
          changes++;
        } else if (!html.includes("money-=EVOLUTION_COST; tower.spent+=EVOLUTION_COST;")) {
          showError("Could not find the evolveTower function.");
          return;
        }

        const oldEvolutionMessage =
          'setMessage(tower.name+" evolved into "+evolution.name+"!");';

        const newEvolutionMessage =
          'setMessage(tower.name+" evolved into "+evolution.name+" for $"+EVOLUTION_COST+"!");';

        if (html.includes(oldEvolutionMessage)) {
          html = html.replace(oldEvolutionMessage, newEvolutionMessage);
          changes++;
        }

        downloadUpdatedFile(html);

        status.className = "success";
        status.textContent =
          "Complete updated game downloaded. Every tower evolution now costs $1,000.";
      };

      reader.onerror = () => {
        showError("The selected file could not be read.");
      };

      reader.readAsText(file);
    });

    function downloadUpdatedFile(html) {
      const blob = new Blob([html], {
        type: "text/html;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "zombie-defense-v5-evolutions-1000.html";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function showError(text) {
      status.className = "error";
      status.textContent = text;
      fileInput.value = "";
    }
  </script>
</body>
</html>
